<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="StudyDock">
  <!--
    Brand mark: the same gradient tile and sparkle the navbar uses, so the tab
    icon matches the header rather than being a second, unrelated logo.
    Colours are the resolved --primary (221 83% 53%) and --secondary
    (244 75% 57%) tokens from globals.css.

    Drawn heavier than the lucide outline on purpose: at 16px a 2px stroke
    disappears, so the sparkle is a filled four-point star instead.
  -->
  <defs>
    <linearGradient id="studydock" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#4A3FE4" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#studydock)" />

  <!-- Four-point star: straight edges pinched toward the centre. -->
  <path
    fill="#fff"
    d="M16 5.5c.5 4.2 1.6 6.6 3.4 8.1 1.5 1.3 3.8 2 7.1 2.4-3.3.4-5.6 1.1-7.1 2.4-1.8 1.5-2.9 3.9-3.4 8.1-.5-4.2-1.6-6.6-3.4-8.1-1.5-1.3-3.8-2-7.1-2.4 3.3-.4 5.6-1.1 7.1-2.4C14.4 12.1 15.5 9.7 16 5.5Z"
  />
  <!-- Small companion spark, mirroring the navbar glyph. -->
  <circle cx="24.5" cy="8" r="1.6" fill="#fff" opacity=".85" />
</svg>
